name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    # The @DataJpaTest / @SpringBootTest suites run against a REAL PostgreSQL
    # (src/test/resources/application.yaml points at localhost:5433), so the workflow
    # starts one and maps it to the same host port we use locally.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pawzaar
          POSTGRES_USER: pawzaar
          POSTGRES_PASSWORD: pawzaar_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pawzaar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Git does not reliably store the executable bit on Windows, so set it here.
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # `verify` compiles, runs every test, and packages the jar (fails the build if any test fails).
      - name: Build and run all tests
        run: ./mvnw -B -ntp verify

  docker:
    name: Build the Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Proves the multi-stage Dockerfile still builds. No push: nothing is deployed from CI yet.
      - name: Build the image
        run: docker build -t pawzaar-api:ci .
