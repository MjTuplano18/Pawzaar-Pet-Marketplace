# ── Production profile ────────────────────────────────────────────────────────
# All secrets must come from environment variables. No fallbacks here.
# Set on your host (Render / Railway / Docker):
#   DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, JWT_SECRET

server:
  # H2: behind a TLS-terminating proxy (Render / Railway / a load balancer) every request
  # arrives from the PROXY's IP, so "the client" would be one IP for all users - and one shared
  # rate-limit bucket (20 requests/minute) that can lock everyone out of login at once.
  # `native` asks Tomcat to apply X-Forwarded-For to the remote address, so the rate limiter
  # keys on the real client IP. This is only safe because those platforms OVERWRITE the header
  # before it reaches us; do not enable it on a host that passes the header through untouched.
  # (Pawzaar's own trust-forwarded-for setting stays false - the container is the single place
  # that may read the header.)
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Free-tier databases (Supabase, Neon, Render) cap connections at 20-60.
      # Keep pool small: total = instances × pool-size must stay under the cap.
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    show-sql: false

pawzaar:
  jwt:
    # Injected by the host's secret store. Must be at least 256-bit Base64.
    secret: ${JWT_SECRET}
    access-token-validity-minutes: ${JWT_VALIDITY_MINUTES:30}
    refresh-token-validity-days: ${JWT_REFRESH_VALIDITY_DAYS:7}
  web:
    cors:
      # REQUIRED on the host: the real front-end origin(s), e.g. https://pawzaar.ph.
      # There is intentionally NO fallback: forgetting this should fail loudly, not silently
      # allow the wrong origin or none at all.
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    # Production stores images in Supabase Storage. No fallbacks: if these are unset the app
    # refuses to start rather than accept uploads it cannot persist.
    type: ${PAWZAAR_STORAGE_TYPE:supabase}
    supabase:
      url: ${SUPABASE_URL}
      bucket: ${SUPABASE_BUCKET}
      profile-bucket: ${SUPABASE_PROFILE_BUCKET}
      document-bucket: ${SUPABASE_DOCUMENT_BUCKET}
      service-key: ${SUPABASE_SERVICE_KEY}
  email:
    # M4d-2: production delivers real mail. Set on the host (standard Spring Boot keys):
    #   SPRING_MAIL_HOST, SPRING_MAIL_PORT=587, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD,
    #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true,
    #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
    # Starting with transport=smtp but no SPRING_MAIL_HOST fails fast (see EmailConfig) so we never
    # silently drop verification emails. Set PAWZAAR_EMAIL_TRANSPORT=log to opt out (dev/CI only).
    transport: ${PAWZAAR_EMAIL_TRANSPORT:smtp}
    # M4d: the public front-end route the verification link must point at.
    verification-base-url: ${PAWZAAR_EMAIL_VERIFICATION_BASE_URL}
    # Never print message bodies in production - they carry live verification tokens.
    log-body: false

# H7: the OpenAPI document describes every route, parameter and schema - a map for an attacker.
# Disable (do not merely secure) both in production so /v3/api-docs and /swagger-ui return 404
# and there is nothing to enumerate. They stay available in dev/test for local work.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
