# ── Production profile ────────────────────────────────────────────────────────
# All secrets must come from environment variables. No fallbacks here.
# Set on your host (Render / Railway / Docker):
#   DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, JWT_SECRET

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Free-tier databases (Supabase, Neon, Render) cap connections at 20-60.
      # Keep pool small: total = instances × pool-size must stay under the cap.
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    show-sql: false

pawzaar:
  jwt:
    # Injected by the host's secret store. Must be at least 256-bit Base64.
    secret: ${JWT_SECRET}
    access-token-validity-minutes: ${JWT_VALIDITY_MINUTES:30}
    refresh-token-validity-days: ${JWT_REFRESH_VALIDITY_DAYS:7}
  web:
    cors:
      # REQUIRED on the host: the real front-end origin(s), e.g. https://pawzaar.ph.
      # There is intentionally NO fallback: forgetting this should fail loudly, not silently
      # allow the wrong origin or none at all.
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    # Production stores images in Supabase Storage. No fallbacks: if these are unset the app
    # refuses to start rather than accept uploads it cannot persist.
    type: ${PAWZAAR_STORAGE_TYPE:supabase}
    supabase:
      url: ${SUPABASE_URL}
      bucket: ${SUPABASE_BUCKET}
      service-key: ${SUPABASE_SERVICE_KEY}
