spring:
  application:
    name: pawzaar-api

  # HikariCP connection pool (Spring Boot's default) opens real PostgreSQL connections
  # to the Docker container from docker-compose.yaml, which maps host port 5433
  # to the container's 5432.
  datasource:
    url: jdbc:postgresql://localhost:5433/pawzaar
    username: pawzaar
    password: pawzaar_dev

  jpa:
    # Entities are only usable INSIDE a transaction - the service layer must open one
    # (@Transactional). Prevents the classic "no session" / lazy-load-outside-tx bugs.
    open-in-view: false
    hibernate:
      # Never generate the schema from entities (that's Flyway's job); only CHECK that
      # every entity field maps to an existing table/column. Startup fails on mismatch.
      ddl-auto: validate
