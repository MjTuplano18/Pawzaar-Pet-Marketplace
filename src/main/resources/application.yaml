# ── HTTP server ───────────────────────────────────────────────────────────────
server:
  # D3: graceful shutdown. On SIGTERM Tomcat stops accepting new connections and lets in-flight
  # requests finish (up to spring.lifecycle.timeout-per-shutdown-phase) before the JVM exits.
  # This only helps because the Dockerfile ENTRYPOINT uses the exec form, so the JVM is PID 1 and
  # receives the signal directly.
  shutdown: graceful

spring:
  application:
    name: pawzaar-api

  # D3: how long to wait for in-flight requests to drain during a graceful shutdown before
  # forcing the process down. Slightly larger than the slowest realistic request.
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  # Upload limits enforced by the servlet container BEFORE our code runs, so an oversized body is
  # rejected cheaply. ImageValidator applies the same limit again as defence in depth.
  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:6MB}

  jpa:
    # Entities are only usable INSIDE a transaction - the service layer must open one
    # (@Transactional). Prevents the classic "no session" / lazy-load-outside-tx bugs.
    open-in-view: false
    hibernate:
      # Never generate the schema from entities (that's Flyway's job); only CHECK that
      # every entity field maps to an existing table/column. Startup fails on mismatch.
      ddl-auto: validate

  # M4d-2: SMTP delivery for real emails. Spring Boot auto-configures a JavaMailSender only when
  # `host` is set, so these are inert until a deployment sets SPRING_MAIL_HOST (transport=smtp).
  # Timeouts mirror H8: a stalled mail server must not tie up a request thread indefinitely.
  mail:
    properties:
      mail.smtp.connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${SPRING_MAIL_SMTP_TIMEOUT:10000}
      mail.smtp.writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:10000}

# ── Pawzaar's own settings ────────────────────────────────────────────────────
pawzaar:
  jwt:
    # 12-FACTOR CONFIG: the value comes from the JWT_SECRET environment variable.
    # Base64-encoded, and HS256 requires at least 256 bits (32 bytes) of key material.
    secret: ${JWT_SECRET}
    access-token-validity-minutes: ${JWT_VALIDITY_MINUTES:30}
    # Refresh tokens outlive access tokens; 7 days is a common "stay signed in" window.
    refresh-token-validity-days: ${JWT_REFRESH_VALIDITY_DAYS:7}
  # H6: per-account caps that stop a single seller filling the marketplace. Soft-deleted listings do
  # not count against the limit, so deleting a listing frees a slot.
  limits:
    max-listings-per-user: ${PAWZAAR_MAX_LISTINGS_PER_USER:20}
    max-images-per-listing: ${PAWZAAR_MAX_IMAGES_PER_LISTING:10}
  web:
    cors:
      # Comma-separated list of browser origins allowed to call this API. NEVER use "*" in
      # production. Override with the CORS_ALLOWED_ORIGINS env var on the host.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Where uploaded images live. `local` writes to disk (the default - no cloud account needed to run
  # or test); `supabase` uploads to a Supabase Storage bucket. The ImageStorage interface lets this
  # change without touching the service or controller.
  storage:
    type: ${PAWZAAR_STORAGE_TYPE:local}                  # local | supabase
    root: ${PAWZAAR_STORAGE_ROOT:uploads}                # used only when type=local
    max-image-bytes: ${PAWZAAR_MAX_IMAGE_BYTES:5242880}   # 5 MiB
    # M1: pixel caps applied AFTER the byte-size check. Rejecting on the header (before decoding)
    # is what stops a tiny "decompression bomb" from exhausting memory. 5000px / 25 MP is generous
    # for a phone photo while staying safe.
    max-image-dimension: ${PAWZAAR_MAX_IMAGE_DIMENSION:5000}
    max-image-pixels: ${PAWZAAR_MAX_IMAGE_PIXELS:25000000}
    supabase:
      # Used only when type=supabase. All are secrets/config; set them on the host, never commit.
      url: ${SUPABASE_URL:}                              # https://<project-ref>.supabase.co
      bucket: ${SUPABASE_BUCKET:pawzaar-images}          # pet listing photos
      profile-bucket: ${SUPABASE_PROFILE_BUCKET:pawzaar-user-profile}  # user avatars
      document-bucket: ${SUPABASE_DOCUMENT_BUCKET:pawzaar-docs}        # vaccine cards, vet records
      service-key: ${SUPABASE_SERVICE_KEY:}              # service-role key; server-side only
      # H8: fail fast instead of blocking a request thread when Supabase is slow or unreachable.
      connect-timeout: ${SUPABASE_CONNECT_TIMEOUT:5s}
      read-timeout: ${SUPABASE_READ_TIMEOUT:15s}
  # Brute-force guard for the unauthenticated auth endpoints (register/login/refresh/logout).
  # A per-client-IP token bucket; see com.pawzaar.common.ratelimit.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}              # master switch
    capacity: ${RATE_LIMIT_CAPACITY:20}             # allowed burst per client
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:20}   # tokens returned each period
    refill-period: ${RATE_LIMIT_REFILL_PERIOD:1m}
    bucket-ttl: ${RATE_LIMIT_BUCKET_TTL:10m}        # idle buckets are reclaimed after this
    max-keys: ${RATE_LIMIT_MAX_KEYS:10000}          # HARD cap on tracked client IPs (Caffeine maximumSize)
    # Only enable behind a proxy you control: X-Forwarded-For is client-supplied and spoofable.
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}

  # M4d: email verification. The default sender logs the message instead of delivering it (see
  # com.pawzaar.common.email), so local dev and tests need no SMTP account; a deployment supplies
  # its own EmailSender bean to actually deliver mail.
  email:
    # M4d-2: how outbound mail is delivered. `log` writes the message to the app log (dev/test, no
    # account needed); `smtp` delivers for real through the auto-configured JavaMailSender - set
    # SPRING_MAIL_HOST (and friends) to enable it. Selecting `smtp` without a mail host fails fast.
    transport: ${PAWZAAR_EMAIL_TRANSPORT:log}
    from: ${PAWZAAR_EMAIL_FROM:no-reply@pawzaar.local}
    # How long an emailed verification link stays valid.
    verification-validity: ${PAWZAAR_EMAIL_VERIFICATION_VALIDITY:24h}
    # The SPA route the link points at; the raw token is appended as ?token=<value>.
    verification-base-url: ${PAWZAAR_EMAIL_VERIFICATION_BASE_URL:http://localhost:5173/verify-email}
    verification-subject: ${PAWZAAR_EMAIL_VERIFICATION_SUBJECT:Verify your Pawzaar email address}
    # Print the message body (which carries the link/token) in the log. DEV ONLY - keep it false
    # everywhere else so verification tokens never end up in logs.
    log-body: ${PAWZAAR_EMAIL_LOG_BODY:false}

# ── Actuator: health probes for the hosting platform / load balancer ──────────
management:
  endpoints:
    web:
      exposure:
        # Expose ONLY health over HTTP. Never expose env, beans, heapdump, mappings, ...
        include: health
  endpoint:
    health:
      # Adds Kubernetes-style /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: true
      # The health route is public, so never leak database/disk details to anonymous callers.
      show-details: never

# ── Logging (M10) ─────────────────────────────────────────────────────────────
# Every log line carries the request id put in the MDC by RequestIdFilter, and the same value is
# echoed in the X-Request-Id response header - so a user's failing request can be traced in the logs.
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"
  level:
    # Keep Pawzaar's own logs at INFO (our code logs warnings/errors where it matters); quiet the noise.
    com.pawzaar: ${PAWZAAR_LOG_LEVEL:INFO}
