spring:
  application:
    name: pawzaar-api

  jpa:
    # Entities are only usable INSIDE a transaction - the service layer must open one
    # (@Transactional). Prevents the classic "no session" / lazy-load-outside-tx bugs.
    open-in-view: false
    hibernate:
      # Never generate the schema from entities (that's Flyway's job); only CHECK that
      # every entity field maps to an existing table/column. Startup fails on mismatch.
      ddl-auto: validate

# ── Pawzaar's own settings ────────────────────────────────────────────────────
pawzaar:
  jwt:
    # 12-FACTOR CONFIG: the value comes from the JWT_SECRET environment variable.
    # Base64-encoded, and HS256 requires at least 256 bits (32 bytes) of key material.
    secret: ${JWT_SECRET}
    access-token-validity-minutes: ${JWT_VALIDITY_MINUTES:30}
    # Refresh tokens outlive access tokens; 7 days is a common "stay signed in" window.
    refresh-token-validity-days: ${JWT_REFRESH_VALIDITY_DAYS:7}
  web:
    cors:
      # Comma-separated list of browser origins allowed to call this API. NEVER use "*" in
      # production. Override with the CORS_ALLOWED_ORIGINS env var on the host.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Actuator: health probes for the hosting platform / load balancer ──────────
management:
  endpoints:
    web:
      exposure:
        # Expose ONLY health over HTTP. Never expose env, beans, heapdump, mappings, ...
        include: health
  endpoint:
    health:
      # Adds Kubernetes-style /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: true
      # The health route is public, so never leak database/disk details to anonymous callers.
      show-details: never
